<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Arena Cup 🌸</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="sair()" style="font-size: 0.8rem; font-weight: 600;">sair</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  @if (mensagemInscricao) {
    <div class="aviso-sucesso">
      {{ mensagemInscricao }}
    </div>
  }

  @for (m of modalidades; track m.id) {
    <app-modalidade-card
      [modalidade]="m"
      (inscrever)="realizarInscricao($event)">
    </app-modalidade-card>
  }

  <div class="rodape-info">
    <div>Total de vagas disponíveis: <strong>{{ totalVagas }}</strong></div>
  </div>
</ion-content>
